<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursing Wolf</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html {
  scroll-behavior: smooth;
}
:root {
  --navy-deep: #060d1f;
  --navy-mid: #0a1633;
  --emerald-dark: #042f2e;
  --emerald-deep: #064e3b;
  --teal-glow: #2dd4bf;
  --teal-bright: #14b8a6;
  --emerald-bright: #10b981;
  --emerald-vivid: #34d399;
  --amber: #f59e0b;
  --amber-bright: #fbbf24;
  --orange: #fb923c;
  --snow: #cbd5e1;
  --snow-dim: #94a3b8;
  --snow-soft: #64748b;
}
body {
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  background: var(--navy-deep);
  color: var(--snow);
  line-height: 1.55;
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background: radial-gradient(at 0% 0%, rgba(6, 78, 59, 0.6) 0%, transparent 50%),
    radial-gradient(at 100% 100%, rgba(4, 47, 46, 0.7) 0%, transparent 55%),
    radial-gradient(rgba(10, 22, 51, 0.8) 0%, transparent 70%),
    linear-gradient(135deg, rgb(6, 13, 31) 0%, rgb(10, 22, 51) 40%, rgb(4, 47, 46) 100%);
  animation: bgShift 15s ease-in-out infinite;
}
@keyframes bgShift {
  0%, 100% { filter: hue-rotate(0deg) brightness(1); }
  50% { filter: hue-rotate(10deg) brightness(1.05); }
}
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image: radial-gradient(circle at 20% 30%, rgba(45, 212, 191, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.06) 0%, transparent 40%);
  animation: auroraMove 20s ease-in-out infinite;
}
@keyframes auroraMove {
  0%, 100% { transform: scale(1) rotate(0deg); }
  33% { transform: scale(1.1) rotate(2deg); }
  66% { transform: scale(0.95) rotate(-2deg); }
}

/* Mouse Glow */
.mouse-glow {
  position: fixed;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(45, 212, 191, 0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  transform: translate(-50%, -50%);
  transition: opacity 0.3s;
  opacity: 0;
}
.mouse-glow.active { opacity: 1; }

/* Particles */
.particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  bottom: -10px;
  border-radius: 50%;
  background: var(--teal-glow);
  animation: floatUp linear infinite;
  opacity: 0;
}
@keyframes floatUp {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-100vh) translateX(30px); opacity: 0; }
}

/* Wave Lines */
.wave-lines {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.wave-line {
  position: absolute;
  left: -50%;
  width: 200%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--teal-glow), transparent);
  animation: waveDrift linear infinite;
}
@keyframes waveDrift {
  0% { transform: translateX(-25%) rotate(-3deg); }
  100% { transform: translateX(25%) rotate(3deg); }
}

/* Welcome Card */
.welcome {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 1.5rem;
}
.welcome-card {
  background: rgba(10, 22, 51, 0.65);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(45, 212, 191, 0.15);
  border-radius: 24px;
  padding: 2.5rem 2rem;
  max-width: 520px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 60px rgba(45, 212, 191, 0.08), 0 25px 50px rgba(0, 0, 0, 0.4);
  animation: cardEnter 0.8s ease-out;
}
@keyframes cardEnter {
  0% { opacity: 0; transform: translateY(40px) scale(0.95); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Logos */
.welcome-logos {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
  margin-bottom: 1.2rem;
}
.welcome-logo {
  width: 70px;
  height: 70px;
  object-fit: contain;
  filter: drop-shadow(0 0 10px rgba(45, 212, 191, 0.3));
  transition: transform 0.3s, filter 0.3s;
}
.welcome-logo:hover {
  transform: scale(1.1);
  filter: drop-shadow(0 0 18px rgba(45, 212, 191, 0.5));
}
.welcome-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
}
.brand-logo-img {
  width: 90px;
  height: 90px;
  object-fit: contain;
  filter: drop-shadow(0 0 14px rgba(45, 212, 191, 0.4));
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(45, 212, 191, 0.4)); }
  50% { transform: scale(1.06); filter: drop-shadow(0 0 22px rgba(45, 212, 191, 0.6)); }
}
.welcome-brand span {
  font-size: 1.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--teal-glow), var(--emerald-vivid), var(--amber-bright));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.5px;
}

/* Basmala */
.welcome-basmala {
  font-size: 1.2rem;
  color: var(--amber-bright);
  margin-bottom: 0.6rem;
  font-weight: 600;
  text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
}

/* Title */
.welcome-title {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--snow);
  margin-bottom: 1.8rem;
  text-shadow: 0 0 20px rgba(45, 212, 191, 0.2);
}

/* Buttons */
.btn-grid {
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  margin-bottom: 1rem;
}
.action-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.7rem;
  padding: 0.85rem 1.2rem;
  border: none;
  border-radius: 14px;
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  position: relative;
  overflow: hidden;
  color: #fff;
}
.action-btn i { font-size: 1.1rem; }
.btn-platform {
  background: linear-gradient(135deg, var(--emerald-deep), var(--teal-bright));
  box-shadow: 0 4px 20px rgba(20, 184, 166, 0.4);
}
.btn-platform:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(20, 184, 166, 0.6); }
.btn-video {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
}
.btn-video:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6); }
.btn-results {
  background: linear-gradient(135deg, #b45309, var(--amber));
  box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
}
.btn-results:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(245, 158, 11, 0.6); }
.btn-whatsapp {
  background: linear-gradient(135deg, #059669, #10b981);
  box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
}
.btn-whatsapp:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(16, 185, 129, 0.6); }
.btn-contact {
  background: linear-gradient(135deg, #0369a1, #0ea5e9);
  box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
}
.btn-contact:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(14, 165, 233, 0.6); }
.btn-edit-results {
  background: linear-gradient(135deg, #dc2626, #f87171);
  box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
}
.btn-edit-results:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(220, 38, 38, 0.6); }
.btn-gpa {
  background: linear-gradient(135deg, #7c3aed, #c084fc);
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
}
.btn-gpa:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6); }
.btn-sarhne {
  background: linear-gradient(135deg, #0891b2, #22d3ee);
  box-shadow: 0 4px 20px rgba(8, 145, 178, 0.4);
}
.btn-sarhne:hover { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(8, 145, 178, 0.6); }

/* Ripple */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: scale(0);
  animation: rippleAnim 0.6s ease-out;
  pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(6, 13, 31, 0.8);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  0% { opacity: 0; }
  100% { opacity: 1; }
}
.modal-card {
  background: rgba(10, 22, 51, 0.9);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(45, 212, 191, 0.2);
  border-radius: 20px;
  padding: 2rem;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 60px rgba(45, 212, 191, 0.1);
  animation: modalEnter 0.4s ease-out;
}
@keyframes modalEnter {
  0% { opacity: 0; transform: scale(0.9) translateY(20px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--teal-glow);
  margin-bottom: 0.5rem;
}
.modal-subtitle {
  font-size: 0.95rem;
  color: var(--snow-dim);
  margin-bottom: 1.5rem;
}
.modal-btns {
  display: flex;
  gap: 0.8rem;
  justify-content: center;
}
.modal-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 1.2rem 1.5rem;
  border: 1px solid rgba(45, 212, 191, 0.2);
  border-radius: 16px;
  background: rgba(45, 212, 191, 0.08);
  color: var(--snow);
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  flex: 1;
  max-width: 150px;
}
.modal-btn i { font-size: 2rem; }
.modal-btn.phone-btn i { color: var(--teal-glow); }
.modal-btn.wa-btn i { color: #25d366; }
.modal-btn:hover {
  transform: translateY(-3px);
  border-color: var(--teal-glow);
  box-shadow: 0 4px 20px rgba(45, 212, 191, 0.2);
}
.modal-close {
  margin-top: 1.2rem;
  background: none;
  border: 1px solid rgba(148, 163, 184, 0.2);
  border-radius: 10px;
  color: var(--snow-dim);
  padding: 0.5rem 1.5rem;
  font-family: 'Cairo', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.3s ease;
}
.modal-close:hover {
  border-color: var(--snow-soft);
  color: var(--snow);
}

/* Footer */
.footer-area {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 1rem;
  color: var(--snow-soft);
  font-size: 0.8rem;
}

/* Responsive */
@media (max-width: 480px) {
  .welcome-card { padding: 2rem 1.2rem; border-radius: 20px; }
  .welcome-logo { width: 55px; height: 55px; }
  .brand-logo-img { width: 70px; height: 70px; }
  .welcome-brand span { font-size: 1.2rem; }
  .welcome-title { font-size: 1.2rem; }
  .action-btn { padding: 0.75rem 1rem; font-size: 0.9rem; }
  .modal-card { padding: 1.5rem; }
}

/* Sub-page views */
.sub-view { display: none; width: 100%; min-height: 100vh; position: relative; z-index: 1; }
.sub-view.active { display: block; }
.sub-back-btn {
  position: fixed; top: 15px; right: 15px; z-index: 9999;
  background: linear-gradient(135deg, #060d1f, #14b8a6);
  color: white; border: none; padding: 10px 18px; border-radius: 12px;
  font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; box-shadow: 0 4px 20px rgba(20, 184, 166, 0.5);
  display: flex; align-items: center; gap: 6px;
}
.sub-back-btn:active { transform: scale(0.95); }
@media print { .sub-back-btn { display: none !important; } }

</style>
</head>

<script>
(function() {
  // MOUSE GLOW
  var mouseGlow = document.getElementById('mouseGlow');
  var mouseX = 0, mouseY = 0, glowX = 0, glowY = 0;
  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX; mouseY = e.clientY;
    mouseGlow.classList.add('active');
  });
  document.addEventListener('mouseleave', function() {
    mouseGlow.classList.remove('active');
  });
  function animateGlow() {
    glowX += (mouseX - glowX) * 0.08;
    glowY += (mouseY - glowY) * 0.08;
    mouseGlow.style.left = glowX + 'px';
    mouseGlow.style.top = glowY + 'px';
    requestAnimationFrame(animateGlow);
  }
  animateGlow();

  // PARTICLES
  var particles = document.getElementById('particles');
  for (var i = 0; i < 30; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    var sz = (2 + Math.random() * 3) + 'px';
    p.style.width = sz; p.style.height = sz;
    p.style.opacity = 0.3 + Math.random() * 0.5;
    particles.appendChild(p);
  }

  // WAVE LINES
  var waveLines = document.getElementById('waveLines');
  for (var j = 0; j < 5; j++) {
    var w = document.createElement('div');
    w.className = 'wave-line';
    w.style.top = (20 + j * 15) + '%';
    w.style.animationDuration = (15 + j * 5) + 's';
    w.style.animationDelay = j * 2 + 's';
    w.style.opacity = 0.1 + j * 0.05;
    waveLines.appendChild(w);
  }

  // RIPPLE
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('.action-btn, .modal-btn');
    if (!btn) return;
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.style.position = 'relative';
    btn.style.overflow = 'hidden';
    btn.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 600);
  });

  // CONTACT MODAL
  var PHONE = '01060275054';
  var modal = document.getElementById('contactModal');
  document.getElementById('contactBtn').addEventListener('click', function() {
    modal.style.display = 'flex';
  });
  modal.addEventListener('click', function(e) {
    if (e.target === modal) modal.style.display = 'none';
  });
  document.getElementById('closeModal').addEventListener('click', function() {
    modal.style.display = 'none';
  });
  document.getElementById('phoneBtn').addEventListener('click', function() {
    window.location.href = 'tel:' + PHONE;
    modal.style.display = 'none';
  });
  document.getElementById('waBtn').addEventListener('click', function() {
    window.open('https://wa.me/20' + PHONE, '_blank');
    modal.style.display = 'none';
  });
})();
</script>

function b64d(b) {
  var bin = atob(b);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

var currentView = 'main';
var loaded = {};

function openPage(type) {

  currentView = type;

  // Hide main, show sub-page

  var view = document.getElementById('view-' + type);
  view.style.display = 'block';
